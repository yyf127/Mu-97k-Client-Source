name: Build MU 0.97k Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Win32 Release
        shell: powershell
        run: |
          msbuild mu97k.sln `
            /p:Configuration=Release `
            /p:Platform=Win32 `
            /m `
            /verbosity:minimal

      - name: Create server.cfg
        shell: powershell
        run: |
          if (Test-Path "server.cfg.example") {
            Copy-Item `
              "server.cfg.example" `
              "bin\Client\server.cfg" `
              -Force
          }

      - name: Verify main.exe
        shell: powershell
        run: |
          $exe = "bin\Client\main.exe"

          if (!(Test-Path $exe)) {
            Write-Error "ERROR: $exe was not generated."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host "======================================"
          Write-Host "MU 0.97k CLIENT BUILD SUCCESS"
          Write-Host "======================================"
          Write-Host "Path   : $($file.FullName)"
          Write-Host "Size   : $($file.Length) bytes"
          Write-Host "Time   : $($file.LastWriteTime)"
          Write-Host "======================================"

      - name: Upload complete client
        uses: actions/upload-artifact@v4
        with:
          name: MU-097k-Client-Win32
          path: bin/Client/
          if-no-files-found: error
